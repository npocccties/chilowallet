version: "3.9"

services:
  # Proxyサーバーを経由するのでウォレットサーバーにおけるWebサーバーは不要
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "3001:3000"
    networks:
      - db_network
      - verifier_network
    container_name: chilowallet
    depends_on:
      obv-validator:
        condition: service_healthy
    restart: "always"
    environment:
      - LOG_LEVEL=$LOG_LEVEL
      # 複数のネットワークに接続しているため、Next.js（standalone）がコンテナ名の IP だけで待ち受けないよう全インターフェースで待ち受ける。
      - HOSTNAME=0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: ${LOG_MAX_FILE}

  # Open Badge 検証サービス（openbadges-validator-core）。ウォレットからのみ参照し、外部には公開しない。
  # 取得先は ALLOWED_FETCH_HOSTS に限定する（DBのネットワークには接続しない）。
  obv-validator:
    build:
      context: ${BADGE_VERIFIER_BUILD_CONTEXT:?BADGE_VERIFIER_BUILD_CONTEXT is not set}
    networks:
      - verifier_network
    restart: "always"
    environment:
      - ALLOWED_FETCH_HOSTS=${ALLOWED_FETCH_HOSTS:?ALLOWED_FETCH_HOSTS is not set}
    # コンテナ内の gunicorn が応答するまでウォレットを起動しない。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: ${LOG_MAX_FILE}

networks:
  db_network:
    driver: bridge
    external: true
  verifier_network:
    driver: bridge
