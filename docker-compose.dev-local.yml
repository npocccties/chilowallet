services:
  app:
    tty: true
    networks:
      - app_network
      - verifier_network
    build:
      context: .
      dockerfile: Dockerfile.dev-local
    ports:
      - "3000:3000"
      - "5555:5555"
    # command: npm run dev
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    container_name: chilowallet
    environment:
      - LOG_LEVEL=$LOG_LEVEL
    depends_on:
      db:
        condition: service_started
      obv-validator:
        condition: service_healthy

  db:
    image: postgres:13
    hostname: db
    env_file:
      - ./.env
    networks:
      - app_network
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  # Open Badge 検証サービス（openbadges-validator-core）。本番と同じ構成をローカルでも使う。
  obv-validator:
    build:
      context: ${BADGE_VERIFIER_BUILD_CONTEXT:?BADGE_VERIFIER_BUILD_CONTEXT is not set}
    networks:
      - verifier_network
    environment:
      - ALLOWED_FETCH_HOSTS=${ALLOWED_FETCH_HOSTS:?ALLOWED_FETCH_HOSTS is not set}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  app_network:
    driver: bridge
  verifier_network:
    driver: bridge
volumes:
  node_modules:
  db_data:
